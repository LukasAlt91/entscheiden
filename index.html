<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Werkzeuge für Entscheidungen</title>
<style>
:root{--paper:#F6F4EF;--ink:#111;--muted:#5C5A55;--line:#D9D6CF;--accent:#2F5D62;--surface:#fff;--warn:#9A5B13}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/26px Inter,Arial,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);padding:32px}
.label{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.label .sq{color:var(--accent)}
h1{font-family:"Inter Tight",Arial,sans-serif;font-weight:600;font-size:30px;line-height:36px;letter-spacing:-.01em;margin:0 0 12px}
p{margin:0 0 20px;color:var(--muted)}
label{display:block;font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 20px;font-size:14px;color:var(--muted)}
.row input{width:auto}
button{width:100%;min-height:48px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:500 15px Inter,Arial,sans-serif;cursor:pointer}
button:hover{background:var(--accent);border-color:var(--accent);color:#fff}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--warn)}
</style>
</head>
<body>
<main>
  <form class="box" id="f" autocomplete="off">
    <p class="label"><span class="sq">■</span> Geschützter Bereich</p>
    <h1>Werkzeuge für Entscheidungen</h1>
    <p>Diese Seite ist passwortgeschützt. Das Passwort findest du in meiner Bewerbung.</p>
    <label for="pw">Passwort</label>
    <input id="pw" type="password" autofocus required>
    <div class="row"><input id="keep" type="checkbox" checked><span><label for="keep" style="display:inline;text-transform:none;letter-spacing:0;font-family:Inter,Arial,sans-serif;font-size:14px">Auf diesem Gerät angemeldet bleiben</label></span></div>
    <button type="submit" id="go">Öffnen →</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>

async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(DATA.salt), iterations: DATA.iter }, base, 640));
}
async function openWith(bits) {
  const encKey = bits.slice(0, 32), macKey = bits.slice(32, 64), iv = bits.slice(64, 80);
  const ct = b64(DATA.ct);
  const mk = await crypto.subtle.importKey("raw", macKey, { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const ok = await crypto.subtle.verify("HMAC", mk, hex(DATA.mac), ct);
  if (!ok) return false;
  const ek = await crypto.subtle.importKey("raw", encKey, "AES-CBC", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, ek, ct));
  document.open(); document.write(html); document.close();
  return true;
}
(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null");
    if (saved && saved.salt === DATA.salt && await openWith(hex(saved.bits))) return;
  } catch (e) { /* weiter mit Eingabe */ }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "";
  try {
    const bits = await derive(document.getElementById("pw").value);
    if (document.getElementById("keep").checked) {
      try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: DATA.salt, bits: toHex(bits) })); } catch (err) {}
    }
    if (!(await openWith(bits))) {
      try { localStorage.removeItem(KEY_STORE); } catch (err) {}
      msg.textContent = "Das Passwort stimmt nicht. Bitte versuch es noch einmal.";
      btn.disabled = false;
    }
  } catch (err) {
    msg.textContent = "Dein Browser kann die Seite nicht entschlüsseln. Bitte nutze einen aktuellen Browser.";
    btn.disabled = false;
  }
});
